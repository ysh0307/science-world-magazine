const shipSim=`<div class="sim" data-sim="ship"><div class="out">지금 내가 서 있는 높이를 골라 보세요.</div><div class="chips"></div><div class="lab"><span>배까지 거리</span><span class="dv"></span></div><input class="ds" type="range" min="0" max="100" step="0.5" value="20" aria-label="배까지의 거리"><svg class="sv" viewBox="0 0 400 190" role="img" aria-label="수평선 너머로 사라지는 배"></svg><div class="big txt" style="font-size:20px"></div><div class="out hline"></div></div>`;
const pages=[{"title":"표지","kind":"cover","html":"<div class=\"stamp\">SCIENCE MYTHS · FIELD NOTE 02</div><div class=\"cover-art\">🏔️</div><h2>산에 올라가면<br>지구가 둥근 게<br>보일까?</h2><div class=\"subtitle\">지구의 곡률을 통한 과학적 검증</div><p class=\"small\" style=\"margin-top:12px;text-align:right\">탐구 · 최기웅</p><p class=\"small\" style=\"margin-top:35px\">연계 교과 · 통합과학(지구 시스템과 과학적 탐구)<br>직접 산에 올라가 보며 확인하는 탐구.</p><div class=\"page-no\">CHEOLSUSAE · 2026</div>"},{"title":"프롤로그 · 일상 속 호기심","html":"<div class=\"stamp\">PROLOGUE</div><h2>땅은 평평해 보이는데…</h2><p class=\"lead\">우리 눈에는 땅이 평평해 보여요. 그런데 지구는 정말 둥글까요?</p><p>학교에서는 지구가 둥글다고 배워요. 하지만 운동장에 서면 바닥은 반듯해 보이죠. 그래서 궁금해졌어요. <b>높은 산에 올라가 둘러보면 지구의 모양을 확인할 수 있을까?</b></p><div class=\"quote\">“평평해 보인다”는 느낌만으로 지구의 모양을 판단해도 될까요?</div><div class=\"callout\"><strong>이번 기사의 질문</strong><p>높이 올라가면 무엇이 달라질까요? “지구는 평평하다”는 주장은 어떻게 반박할 수 있을까요? 탐구 방법을 알려드리기 전에, 먼저 여러분이 직접 산에 올라가 볼 거예요.</p></div>"},{"title":"PART 1 · 왜 평평해 보일까?","html":"<div class=\"stamp\">PART 01 · Q1</div><h2>지구는 둥근데 왜 평평해 보일까?</h2><p>이유는 간단해요. <b>지구가 너무너무 크기 때문이에요.</b> 지구의 반지름은 약 6,371km예요. 개미가 커다란 공 위에 서 있으면 바닥이 평평하게 느껴지는 것과 같아요.</p><div class=\"two\"><div class=\"mini\"><b>지구</b><p>반지름 약 6,371km. 아주 커서 한 곳에서 보면 휘어짐이 거의 느껴지지 않아요.</p></div><div class=\"mini\"><b>우리가 걷는 동네</b><p>지구에 비하면 아주 좁은 범위라서 땅이 반듯해 보여요.</p></div></div><div class=\"game\" data-correct=\"b\" data-why=\"지구가 아주 크기 때문에 좁은 범위에서는 휘어짐을 거의 느끼지 못해요.\" data-wrong=\"나무나 캐세요..\"><div class=\"label\">MINI GAME 01</div><h3>평평해 보이는 이유는?</h3><p>지구가 둥근데도 평평해 보이는 이유로 알맞은 것은?</p><div class=\"choices\"><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"a\">A. 지구가 사실 마인크래프트라서</div><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"b\">B. 지구가 너무 커서 좁은 범위에서는 휘어짐이 거의 안 느껴져서</div></div><div class=\"feedback\"></div></div>"},{"title":"PART 2 · 직접 산에 올라가 보자","html":"<div class=\"stamp\">PART 02 · TRY IT</div><h2>직접 산에 올라가 보자!</h2><p>설명은 잠시 뒤로! 슬라이더를 움직여 <b>산을 오르고 하늘로 날아 보세요.</b></p><div class=\"sim\" data-sim=\"climb\"><div class=\"lab\"><span>내가 서 있는 높이</span><span class=\"hv\"></span></div><input class=\"hs\" type=\"range\" min=\"1\" max=\"10000\" step=\"1\" aria-label=\"서 있는 높이(미터)\"><div class=\"chips\"></div><button class=\"tg\" type=\"button\"></button><svg class=\"view\" viewBox=\"0 0 400 260\" role=\"img\" aria-label=\"산 위에서 바라본 수평선\"></svg><div class=\"out\" style=\"margin-top:8px\">수평선까지 보이는 거리</div><div class=\"big dist\"></div><div class=\"out cmp\"></div></div><div class=\"callout\"><strong>이렇게 관찰해 보세요</strong><p>① 수평선이 눈높이(노란 점선)보다 내려가나요? ② 수평선 양쪽 끝이 조금씩 휘나요? ③ 보이는 거리는 어떻게 달라지나요?</p></div><p class=\"smallnote\">실제 휘어짐은 아주 작아서, 기본으로 6배 키워 그렸어요. 버튼을 누르면 실제 크기로 볼 수 있어요.</p>"},{"title":"PART 2 · 바다 위의 배","html":"<div class=\"stamp\">PART 02 · TRY IT</div><h2>멀어지는 배는 어떻게 보일까?</h2><p>이번에는 바다에 배를 띄워 볼게요. 슬라이더로 배를 멀리 보내 보세요. 그냥 작아지기만 할까요?</p><div class=\"sim\" data-sim=\"ship\"><div class=\"out\">지금 내가 서 있는 높이를 골라 보세요.</div><div class=\"chips\"></div><div class=\"lab\"><span>배까지 거리</span><span class=\"dv\"></span></div><input class=\"ds\" type=\"range\" min=\"0\" max=\"100\" step=\"0.5\" value=\"20\" aria-label=\"배까지의 거리\"><svg class=\"sv\" viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"수평선 너머로 사라지는 배\"></svg><div class=\"big txt\" style=\"font-size:20px\"></div><div class=\"out hline\"></div></div><div class=\"callout\"><strong>발견한 점</strong><p>배는 작아지기만 하지 않고, <b>아래쪽부터 수평선 너머로 가려져요.</b> 높은 곳에서는 더 멀리 보내야 사라져요.</p></div>"},{"title":"PART 3 · 어떤 탐구 방법을 썼을까?","html":"<div class=\"stamp\">PART 03 · METHOD</div><h2>높이를 바꿔 가며 계산해 봤어요</h2><p class=\"lead\">우리가 쓴 탐구 방법은 <b>“높이를 바꿔 가며 수평선까지의 거리를 계산하고 비교하기”</b>예요.</p><h3>Q2. 산에 오르면 무엇을 관찰할 수 있나요?</h3><p>높이 올라갈수록 더 넓은 범위가 보이고, 수평선까지의 거리도 달라져요. 이것은 지구의 곡률과 관련된 현상이에요.</p><h3>Q3. 어떻게 계산할 수 있나요?</h3><p>지구 중심, 내 눈, 수평선 끝을 이으면 직각삼각형이 생겨요. 피타고라스 정리를 쓰면 아래처럼 간단한 식이 나와요.</p><div class=\"callout\"><strong>수평선까지의 거리(km) ≈ 3.57 × √높이(m)</strong><p>예) 높이 100m → √100 = 10 → 약 36km</p></div><table class=\"table\"><tbody><tr><th>장소</th><th>높이</th><th>수평선까지</th></tr><tr><td>내 키(어린이)</td><td>1.4 m</td><td>4.2 km</td></tr><tr><td>남산</td><td>262 m</td><td>57.8 km</td></tr><tr><td>북한산 백운대</td><td>836 m</td><td>103 km</td></tr><tr><td>한라산</td><td>1,947 m</td><td>158 km</td></tr><tr><td>백두산</td><td>2,744 m</td><td>187 km</td></tr><tr><td>에베레스트</td><td>8,849 m</td><td>336 km</td></tr><tr><td>비행기(순항)</td><td>10,000 m</td><td>357 km</td></tr></tbody></table><div class=\"game\" data-correct=\"b\" data-why=\"높이가 4배가 되면 √(루트)는 2배가 되어서, 거리도 2배가 돼요. 100m는 약 36km, 400m는 약 71km예요.\" data-wrong=\"높이를 x라고 하면 수평선을 계산할땐 √x 배를 해요.\"><div class=\"label\">MINI GAME 02</div><h3>높이가 4배가 되면?</h3><p>100m에서 400m로 올라가면 수평선까지 거리는 몇 배가 될까요?</p><div class=\"choices\"><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"a\">A. 4배</div><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"b\">B. 2배</div></div><div class=\"feedback\"></div></div>"},{"title":"PART 4 · 평평설 반박하기","html":"<div class=\"stamp\">PART 04 · EVIDENCE</div><h2>“지구는 평평하다”는 주장, 어떻게 반박할까?</h2><h3>Q4. 어떤 근거가 있나요?</h3><div class=\"two\"><div class=\"mini\"><b>배는 아래쪽부터 사라져요</b><p>먼 물체는 아래쪽부터 가려져요. 평평한 바다라면 통째로 작아져야 해요.</p></div><div class=\"mini\"><b>높이에 따라 수평선이 달라져요</b><p>올라갈수록 보이는 거리가 멀어지는 건 지구가 휘어 있기 때문이에요.</p></div><div class=\"mini\"><b>인공위성 관측 자료</b><p>우주에서 얻은 자료도 지구가 구형에 가깝다는 걸 보여줘요.</p></div></div><div class=\"game\" data-correct=\"a\" data-why=\"평평한 바다라면 배는 통째로 작아지다가 점이 되어야 해요. 아래쪽부터 사라지는 건 바다가 휘어 있다는 증거예요.\"><div class=\"label\">MINI GAME 03</div><h3>아래쪽부터 사라진다면?</h3><p>멀어지는 배의 아래쪽부터 가려지는 현상은 무엇을 뜻할까요?</p><div class=\"choices\"><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"a\">A. 바다 표면이 휘어 있다는 증거</div><div class=\"choice\" role=\"button\" tabindex=\"0\" data-answer=\"b\">B. 배가 가라앉았다는 증거</div></div><div class=\"feedback\"></div></div>"},{"title":"에필로그 · 탐구 성찰","html":"<div class=\"stamp\">EPILOGUE</div><h2>탐구를 마치며</h2><p class=\"lead\">당연하게 느끼는 일도 직접 관찰하고 계산해 보면 더 정확히 알 수 있어요.</p><p>이번 탐구로 “평평해 보인다”는 단순한 경험만으로 지구의 실제 모양을 판단하면 안 된다는 걸 깨달았어요.</p><div class=\"quote\">앞으로 이상한 주장을 들어도 무조건 믿지 않고, 관찰과 과학적 근거로 판단할래요.</div><div class=\"footnote\">이 기사의 시뮬레이터는 공기에 의한 빛의 굴절을 계산에 넣지 않았어요(실제로는 수평선이 조금 더 멀리 보여요). 배의 높이는 40m로 가정했고, 산의 높이는 대략의 값이에요. 수평선의 휘어짐은 알아보기 쉽게 6배로 키워 그렸어요.</div>"}];
let sims=[];
const PRE=[["내 키",1.5],["남산",262],["한라산",1947],["백두산",2744],["에베레스트",8849],["비행기",10000]];
function applyBg(m){document.body.style.background='rgb('+mixc([228,230,233],[5,6,10],dark(m)).join(',')+')';document.body.classList.toggle('night',dark(m)>0.45);}
function setH(m){S.h=m;sims.forEach(f=>f());applyBg(m);}
const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const dark=m=>Math.min(1,Math.pow(m/10000,0.7));
const sky=m=>'rgb('+mixc([215,230,238],[4,6,14],dark(m)).join(',')+')';
const sea=m=>'rgb('+mixc([50,128,160],[18,50,66],dark(m)*.8).join(',')+')';
const ink=m=>dark(m)>0.45?'#f2f2f2':'#20271f';
const ST=[[40,30],[90,62],[150,18],[230,44],[300,24],[360,58],[70,88],[190,70],[330,86],[260,12],[20,60],[120,40],[380,20],[210,90]];
const stars=m=>{const d=dark(m);return d<.4?'':ST.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.3" fill="#fff" opacity="${((d-.4)/.6).toFixed(2)}"/>`).join('');};
function view(m){
 const d=dark(m),dip=Math.acos(R/(R+m/1000)),y0=100,f=72.8,E=S.exa;
 const Y=x=>y0+E*f*Math.tan(dip)/Math.cos(Math.atan((x-200)/f));
 const pts=[];for(let i=0;i<=40;i++)pts.push([i*10,Y(i*10)]);
 const hc=Y(200),t1=Math.min(1,d/0.92),t2=Math.max(0,(d-0.92)/0.08),g=Math.min(1,d*1.15);
 const c=(a,b,t)=>'rgb('+mixc(a,b,t).join(',')+')';
 const top=c(mixc([150,200,232],[14,42,92],t1),[3,8,22],t2),bot=c([215,230,238],[165,200,232],t1);
 const gt=c([50,128,160],[238,242,247],g),gb=c([30,95,125],[196,208,224],g);
 const line=pts.map(p=>p[0]+' '+p[1].toFixed(1)).join(' L');
 const up=pts.map(p=>p[0]+' '+(p[1]-26).toFixed(1)).join(' L'),dn=pts.slice().reverse().map(p=>p[0]+' '+p[1].toFixed(1)).join(' L');
 const st=d>.45?'stroke="#0a1730" stroke-width="3" paint-order="stroke"':'';
 let far='';
 if(m>800)[[40,14],[100,22],[150,12],[290,18],[350,26]].forEach(([x,h])=>{const y=Y(x);far+=`<path d="M${x-16} ${y+2} L${x} ${y-h} L${x+16} ${y+2}Z" fill="#e6ecf3"/><path d="M${x} ${y-h} L${x+16} ${y+2} L${x+3} ${y+2}Z" fill="#9aa8ba"/>`;});
 const k=Math.min(1,m/2500),lit=c([106,110,115],[245,247,250],k),sh=c([80,84,88],[159,171,185],k);
 const fg=m>20?`<path d="M0 260 L0 185 L45 170 L95 215 L125 238 L150 260Z" fill="${lit}"/><path d="M45 170 L95 215 L125 238 L150 260 L70 260 L60 205Z" fill="${sh}"/><path d="M400 260 L400 178 L362 192 L330 218 L300 238 L270 260Z" fill="${lit}"/><path d="M362 192 L330 218 L300 238 L270 260 L335 260 L350 225Z" fill="${sh}"/>`:'';
 return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset=".55" stop-color="${bot}"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${gt}"/><stop offset="1" stop-color="${gb}"/></linearGradient><linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ebf5ff" stop-opacity="0"/><stop offset="1" stop-color="#ebf5ff" stop-opacity="${(.3+.55*t1).toFixed(2)}"/></linearGradient></defs><rect width="400" height="260" fill="url(#sk)"/>${stars(m)}<path d="M${up} L${dn}Z" fill="url(#hz)"/><path d="M${line} L400 260 L0 260Z" fill="url(#gr)"/>${far}<line x1="0" y1="${y0}" x2="400" y2="${y0}" stroke="#b78c4b" stroke-width="2" stroke-dasharray="6 4"/><text x="10" y="${y0-6}" font-size="12" fill="${ink(m)}" ${st}>내 눈높이</text><text x="200" y="${hc-8}" text-anchor="middle" font-size="13" font-weight="700" fill="${ink(m)}" ${st}>수평선</text>${fg}`;
}
function shipSvg(m,dk){
 const hd=hor(m),sh=40,hy=100,hidden=dk>hd?Math.min(sh,Math.pow(dk-hd,2)/(2*R)*1000):0,vis=(sh-hidden)/sh;
 const Z=Math.max(0.3,1-0.65*dk/(hd+35))*80,near=dk<hd?Math.min(1,(hd-dk)/hd):0,base=hy+near*35+Z*(1-vis),W=Z*1.5,x=200,cb=hidden>0?hy:190;
 return `<defs><clipPath id="cp"><rect width="400" height="${cb}"/></clipPath></defs><rect width="400" height="190" fill="${sky(m)}"/><rect y="${hy}" width="400" height="90" fill="${sea(m)}"/><line x1="0" y1="${hy}" x2="400" y2="${hy}" stroke="#20271f" opacity=".4"/><g clip-path="url(#cp)"><path d="M${x-W/2} ${base-0.3*Z} L${x+W/2} ${base-0.3*Z} L${x+W*0.35} ${base} L${x-W*0.35} ${base} Z" fill="#20271f"/><rect x="${x-W*0.2}" y="${base-0.52*Z}" width="${W*0.4}" height="${0.22*Z}" fill="#faf7ef" stroke="#20271f" stroke-width="1.5"/><rect x="${x-0.02*Z}" y="${base-Z}" width="${0.04*Z}" height="${0.48*Z}" fill="#20271f"/><path d="M${x+0.02*Z} ${base-Z} L${x+0.22*Z} ${base-0.93*Z} L${x+0.02*Z} ${base-0.86*Z} Z" fill="#b78c4b"/></g>`;
}
function initSims(root){
 sims=[];
 root.querySelectorAll('.sim').forEach(sim=>{
  const ch=sim.querySelector('.chips');
  PRE.forEach(([n,m])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>setH(m);ch.appendChild(b);});
  if(sim.dataset.sim==='climb'){
   const hs=sim.querySelector('.hs'),tg=sim.querySelector('.tg');
   hs.oninput=()=>setH(+hs.value);
   tg.onclick=()=>{S.exa=S.exa===6?1:6;sims.forEach(f=>f());};
   sims.push(()=>{
    const m=S.h,hd=hor(m);hs.value=m;
    sim.querySelector('.hv').textContent=m>=1000?(m/1000).toFixed(2)+' km':(Math.round(m*10)/10)+' m';
    sim.querySelector('.view').innerHTML=view(m);
    sim.querySelector('.dist').textContent='약 '+fmt(hd)+' km';
    sim.querySelector('.cmp').textContent=hd>=300?'서울~부산(약 325km)에 가까운 거리예요!':hd>=100?'서울에서 대전까지(약 140km)와 비슷한 거리예요.':hd>=30?'서울 시내를 가로지르고도 남는 거리예요.':'동네 한 바퀴보다 조금 먼 거리예요.';
    tg.classList.toggle('on',S.exa===6);tg.textContent=S.exa===6?'휘어짐 6배로 키움 (눌러서 실제 크기로)':'실제 크기 (눌러서 6배로 키우기)';
   });
  }else{
   const ds=sim.querySelector('.ds');
   const upd=()=>{
    const m=S.h,hd=hor(m),dk=Math.max(1,+(ds.value/100*(hd+35)).toFixed(1));
    sim.querySelector('.dv').textContent=dk+' km';
    sim.querySelector('.sv').innerHTML=shipSvg(m,dk);
    const hidden=dk>hd?Math.min(40,Math.pow(dk-hd,2)/(2*R)*1000):0,pct=Math.round((40-hidden)/40*100);
    sim.querySelector('.txt').textContent=dk<=hd?'배가 전부 보여요.':pct>0?'배의 아래쪽이 가려져서 '+pct+'%만 보여요!':'배가 수평선 너머로 완전히 사라졌어요!';
    sim.querySelector('.hline').textContent='서 있는 높이 '+(m>=1000?(m/1000).toFixed(2)+' km':(Math.round(m*10)/10)+' m')+' → 수평선까지 약 '+fmt(hd)+' km';
   };
   ds.oninput=upd;sims.push(upd);
  }
 });
 sims.forEach(f=>f());applyBg(sims.length?S.h:0);
}
let current=0,mode='flip';const page=document.getElementById('page'),single=document.getElementById('singlepage'),all=document.getElementById('allpages'),progress=document.getElementById('progress'),nav=document.getElementById('navrow'),toc=document.getElementById('toc');
function render(){
  page.className='page '+(pages[current].kind||'');
  page.innerHTML=pages[current].html+(pages[current].kind==='cover'?'':`<div class="page-no">${String(current+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</div>`);
  progress.textContent=String(current+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').disabled=current===pages.length-1;
  attachGames(page);initSims(page);
}
function buildToc(){
  const grid=document.getElementById('tocgrid');
  grid.innerHTML=pages.map((p,i)=>`<button data-page="${i}">${String(i+1).padStart(2,'0')} · ${p.title}</button>`).join('');
  grid.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.page);setMode('flip');render();toc.classList.remove('open');}));
}
function setMode(m){
  mode=m;
  document.getElementById('flipBtn').classList.toggle('active',m==='flip');
  document.getElementById('scrollBtn').classList.toggle('active',m==='scroll');
  if(m==='scroll'){
    single.classList.add('hide');all.classList.add('show');
    all.innerHTML=pages.map((p,i)=>`<article class="page ${p.kind||''}">${p.html}<div class="page-no">${String(i+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</div></article>`).join('');
    nav.style.display='none';attachGames(all);initSims(all);
  }else{
    single.classList.remove('hide');all.classList.remove('show');all.innerHTML='';nav.style.display='flex';
    attachGames(page);initSims(page);
  }
}
function gameClick(e){if(editing)return;
  const b=e.currentTarget,game=b.closest('.game'),box=game.querySelector('.feedback');
  game.querySelectorAll('.choice').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false');});
  b.classList.add('selected');b.setAttribute('aria-pressed','true');box.classList.add('show');
  box.textContent=b.dataset.answer===game.dataset.correct?'정답입니다! '+game.dataset.why:(game.dataset.wrong||DEFWRONG);
}
function attachGames(root){root.querySelectorAll('.choice').forEach(b=>{b.addEventListener('click',gameClick);b.addEventListener('keydown',e=>{if(!editing&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gameClick({currentTarget:b});}});b.setAttribute('aria-pressed','false');});}
document.getElementById('prev').addEventListener('click',()=>{if(current>0){current--;render();}});
document.getElementById('next').addEventListener('click',()=>{if(current<pages.length-1){current++;render();}});
document.getElementById('tocBtn').addEventListener('click',()=>toc.classList.toggle('open'));
document.getElementById('flipBtn').addEventListener('click',()=>{setMode('flip');render();});
document.getElementById('scrollBtn').addEventListener('click',()=>setMode('scroll'));
const EDITSEL='h2,h3,p,li,.stamp,.quote,.callout strong,.mini b,.mini p,.choice,.subtitle,.footnote,td,th,.smallnote,.readerhead h1,.readerhead p';
function applyEdit(){document.querySelectorAll(EDITSEL).forEach(el=>{if(el.closest('.sim')||el.closest('#toc'))return;if(editing)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable');});
document.querySelectorAll('.game').forEach(g=>{const old=g.querySelector('.gedit');if(!editing){if(old)old.remove();return;}if(old)return;
const ds=[...g.querySelectorAll('.choice')].map(c=>c.dataset.answer);const d=document.createElement('div');d.className='gedit';
d.innerHTML='<b>퀴즈 설정</b> · 정답 <select class="gc">'+ds.map(a=>'<option value="'+a+'"'+(a===g.dataset.correct?' selected':'')+'>'+a.toUpperCase()+'</option>').join('')+'</select><div class="gl">맞혔을 때 문구 (앞에 “정답입니다!”가 붙어요)</div><div class="gf" contenteditable="true" data-k="why"></div><div class="gl">틀렸을 때 문구</div><div class="gf" contenteditable="true" data-k="wrong"></div>';
d.querySelector('[data-k=why]').textContent=g.dataset.why||'';d.querySelector('[data-k=wrong]').textContent=g.dataset.wrong||DEFWRONG;g.appendChild(d);});}
const _r=render;render=function(){_r();applyEdit();};
const _s=setMode;setMode=function(m){_s(m);applyEdit();};
function serial(art,kind){const c=art.cloneNode(true);c.querySelectorAll('.gedit').forEach(x=>x.remove());c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));c.querySelectorAll('.sim').forEach(el=>{el.outerHTML=el.dataset.sim==='climb'?climbSim:shipSim;});c.querySelectorAll('.feedback').forEach(f=>{f.textContent='';f.classList.remove('show');});c.querySelectorAll('.choice').forEach(x=>{x.classList.remove('selected');x.removeAttribute('aria-pressed');});if(kind!=='cover')c.querySelectorAll('.page-no').forEach(x=>x.remove());return c.innerHTML;}
document.addEventListener('input',e=>{if(!editing||!e.target.closest)return;const gf=e.target.closest('.gf');if(gf)gf.closest('.game').dataset[gf.dataset.k]=gf.textContent;const art=e.target.closest('article.page');if(!art)return;const i=art.id==='page'?current:[...all.children].indexOf(art);if(i>=0)pages[i].html=serial(art,pages[i].kind);});
document.addEventListener('change',e=>{if(!editing||!e.target.classList||!e.target.classList.contains('gc'))return;const g=e.target.closest('.game');g.dataset.correct=e.target.value;const art=g.closest('article.page');const i=art.id==='page'?current:[...all.children].indexOf(art);pages[i].html=serial(art,pages[i].kind);});
document.addEventListener('paste',e=>{if(!editing||!e.target.closest||!e.target.closest('[contenteditable]'))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
function exportViewOnly(){
  const cl=document.documentElement.cloneNode(true);
  cl.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  const b=cl.querySelector('body');b.removeAttribute('style');b.classList.remove('editing','night');
  cl.querySelector('#page').innerHTML='';cl.querySelector('#page').className='page';
  cl.querySelector('#allpages').innerHTML='';cl.querySelector('#allpages').className='allpages';
  cl.querySelector('#singlepage').className='reader singlepage';
  cl.querySelector('#navrow').removeAttribute('style');
  cl.querySelector('#toc').className='toc';cl.querySelector('#tocgrid').innerHTML='';
  cl.querySelector('#flipBtn').className='btn active';cl.querySelector('#scrollBtn').className='btn';cl.querySelector('#editBtn').className='btn';
  const sc=cl.querySelector('script');let t=sc.textContent;
  t=t.replace(/const pages=\[[\s\S]*?\];\nlet sims=\[\];/,()=>'const pages='+JSON.stringify(pages).replace(/<\/script/gi,'<\\/script')+';\nlet sims=[];');
  t=t.replace('const VIEW_ONLY='+'false;','const VIEW_ONLY='+'true;');
  sc.textContent=t;
  return '<!doctype html>\n'+cl.outerHTML;
}
document.getElementById('editBtn').addEventListener('click',()=>{editing=!editing;document.body.classList.toggle('editing',editing);const bt=document.getElementById('editBtn');bt.classList.toggle('active',editing);bt.textContent=editing?'✏️ 편집 끝내기':'✏️ 편집';applyEdit();});
document.getElementById('saveBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportViewOnly()],{type:'text/html'}));a.download='지구곡률_보기전용.html';document.body.appendChild(a);a.click();a.remove();});
if(VIEW_ONLY){document.getElementById('editBtn').style.display='none';document.getElementById('saveBtn').style.display='none';}
buildToc();render();
</script>
</body></html>
