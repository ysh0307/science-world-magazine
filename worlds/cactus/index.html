const pages=[
{title:'표지',kind:'cover',html:`<div class="stamp">SCIENCE MYTHS · FIELD NOTE 01</div><div class="cover-art">🌵</div><h2>선인장은<br>전자파를 먹을까?</h2><div class="subtitle">과학적 사실이 미신이 되는 순간</div><p class="small" style="margin-top:12px;text-align:right">탐구 · 유승환</p><p class="small" style="margin-top:35px">우리가 믿어온 이야기의 근거를 확인하고,<br>실제 성립 조건을 찾아가는 탐구.</p><div class="page-no">CHEOLSUSAE · 2026</div>`},
{title:'프롤로그 · 책상 위의 작은 방패',html:`<div class="stamp">PROLOGUE</div><h2>책상 위의 작은 방패</h2><p class="lead">컴퓨터 옆에 선인장을 두면 전자파를 흡수한다는 이야기를 들어본 적 있나요?</p><p>한때 컴퓨터 모니터 옆에 작은 선인장을 놓는 일이 유행했어요. 선인장이 컴퓨터에서 나오는 전자파를 빨아들여 사람을 보호해 준다는 그런 믿음이 있었기 때문이에요.</p><div class="quote">그런데 선인장이 전자파를 일부 흡수할 수 있다는 말과, 선인장이 사람을 전자파로부터 보호한다는 말은 같은 뜻일까요?</div><p>이번 탐구는 이 두 문장을 구분하는 데서 출발해요. 선인장에 관한 주장을 과학적으로 살펴보고, 그 믿음이 퍼진 배경과 실제로 전자파를 줄이려면 어떤 조건이 필요한지도 알아볼게요.</p><div class="callout"><strong>이번 기사의 질문이에요</strong><p>우리는 왜 과학적으로 틀린 주장을 사실이라고 믿게 될까요? 그리고 그 주장은 어떤 조건에서 실제로 성립할 수 있을까요?</p></div>`},
{title:'PART 1 · 전자파라는 말의 함정',html:`<div class="stamp">PART 01 · SCIENCE CHECK</div><h2>전자파라는 말의 함정</h2><p>전자파(전기와 자기의 변화가 파동처럼 퍼져 나가는 현상)는 한 종류만 있는 것이 아니에요. 라디오나 휴대전화에 쓰이는 전파부터 적외선, 우리가 눈으로 보는 빛, 자외선, X선까지 여러 종류가 있어요. 이때 주파수는 파동이 1초 동안 얼마나 빠르게 반복되는지를 나타내요. 종류와 주파수가 다르면 물질을 만났을 때 반응하는 방식도 달라져요.</p><div class="spectrum-panel" role="group" aria-label="전자기파 종류와 생활 속 예시">

<p class="spectrum-foot">파동 그림은 종류에 따른 파장 차이를 쉽게 보여 주기 위한 예시이며, 실제 파장 비율을 그대로 나타낸 것은 아니에요. 마이크로파는 넓게 보면 전파에 포함해 분류하기도 해요. 이번 탐구에서 측정한 Wi-Fi 신호는 2.4GHz 대역을 사용해 마이크로파 영역에 해당해요.</p>
</div><div class="two"><div class="mini"><b>60Hz</b><p>우리나라 가정용 전기는 1초에 60번 반복돼요. 전기 주변에는 이와 관련된 전기장과 자기장이 생겨요.</p></div><div class="mini"><b>2.4GHz</b><p>이번 탐구에서 측정한 Wi-Fi가 사용하는 주파수 대역이에요. 1초에 약 24억 번 반복되는 빠른 진동을 뜻해요.</p></div></div><p>그래서 “선인장이 전자파를 막는다”는 주장을 살펴보려면 먼저 어떤 종류의 전자파를 말하는지 정해야 해요. 한 종류의 전자파에서 나타난 특징을 모든 전자파에 똑같이 적용할 수는 없어요.</p><div class="game"><div class="label">MINI GAME 01</div><h3>전자파, 모두 똑같을까?</h3><p>Wi-Fi와 가정용 전원의 60Hz 전기장과 자기장은 같은 주파수일까요?</p><div class="choices"><button class="choice" data-game="g1" data-answer="a">A. 같다</button><button class="choice" data-game="g1" data-answer="b">B. 다르다</button></div><div class="feedback" id="g1">정답! 60Hz와 2.4GHz는 주파수가 크게 다릅니다. 주파수가 달라지면 물질과 상호작용하는 방식과 차폐 조건도 달라질 수 있어요.</div></div>`},
{title:'PART 1 · 흡수와 차폐는 달라요',html:`<div class="stamp">PART 01 · KEY CONCEPT</div><h2>흡수한다고 차단되는 것은 아니에요</h2><p>전자파가 물체를 만나면 일부는 표면에서 튕겨 나오고, 일부는 물체에 흡수되며, 나머지는 통과할 수 있어요. 실제 상황에서는 이 과정들이 함께 일어나기도 해요.</p><div class="two"><div class="mini"><b>반사</b><p>전자파가 물체 표면에 부딪혀 되돌아오는 일이에요.</p></div><div class="mini"><b>흡수</b><p>전자파의 에너지가 물체로 전달되는 일이에요. 전달된 에너지 일부는 열처럼 다른 형태로 바뀔 수 있어요.</p></div><div class="mini"><b>통과</b><p>전자파가 물체를 지나 반대편으로 나오는 일이에요.</p></div><div class="mini"><b>차폐</b><p>보호하려는 공간 안으로 들어오는 전자파의 세기를 줄이는 효과예요.</p></div></div><div class="callout"><strong>두 개념은 달라요</strong><p>흡수는 물체에서 일어나는 하나의 현상이고, 차폐는 특정 공간에 도달하는 전자파를 줄이는 효과예요. 차폐에는 전자파가 되돌아가는 현상과 물체에 흡수되는 현상 등이 함께 작용할 수 있어요.</p></div><p>선인장에 닿은 전자파 일부가 흡수되더라도, 선인장 옆이나 위로 지나가는 전파까지 사라지는 것은 아니에요. 전자파는 여러 방향으로 퍼지기 때문에 작은 화분 하나를 기기 옆에 둔다고 주변 공간 전체를 보호하기는 어려워요.</p><div class="game"><div class="label">MINI GAME 02</div><h3>이건 흡수일까, 차폐일까?</h3><p>물체 하나가 전자파 일부를 흡수했지만, 물체 옆으로 지나간 전파는 그대로 전달됐어요. 가장 정확한 설명은 무엇일까요?</p><div class="choices"><button class="choice" data-game="g2" data-answer="a">A. 일부 에너지는 흡수됐지만 공간 전체가 차폐된 것은 아니다.</button><button class="choice" data-game="g2" data-answer="b">B. 공간 전체가 차폐됐다.</button></div><div class="feedback" id="g2">정답! 흡수는 물질과 에너지의 상호작용이고, 전파를 줄이는 것은 보호하려는 공간으로 들어오는 전파를 줄이는 문제예요.</div></div>`},
{title:'PART 2 · 미신은 어떻게 퍼졌을까?',html:`<div class="stamp">PART 02 · ORIGIN</div><h2>미신은 어떻게 퍼졌을까?</h2><p>선인장이 전자파를 흡수한다는 이야기는 인터넷이 생긴 뒤 갑자기 등장한 것만은 아니에요. 1990년대 초중반 한국에서는 전자파가 인체에 해로운지에 대한 관심과 걱정이 커졌고, 선인장이 전자파를 흡수한다는 믿음도 널리 알려졌어요.</p><div class="callout"><strong>역사 자료에서 확인되는 사실</strong><p>디자인 연구 논문에 따르면 1992년 전자파의 유해성에 대한 주장이 대중의 관심을 얻었고, 1993년에는 선인장이 전자파를 흡수한다는 믿음이 퍼지면서 선인장 키우기가 유행했어요.</p></div><p>1996년 동아일보 기사에도 선인장에 닿은 전자파 일부가 흡수될 수는 있지만, 선인장이 사람에게 오는 전자파까지 막아주는 것은 아니라는 설명이 함께 나와요.</p><h3>그렇다면 최초의 발단은?</h3><p>현재 확인한 자료만으로는 이 이야기가 처음 만들어진 순간을 정확히 알기 어려워요. 그래서 특정 연구나 한 사람을 최초로 퍼뜨린 주체라고 단정하지 않았어요. 당시 전자파에 대한 사회적 걱정과 선인장에 수분이 많다는 설명이 합쳐지면서 믿음이 퍼졌을 가능성이 있다고 볼 수 있어요.</p><div class="quote">사회적 불안 + 그럴듯한 과학 설명 + 검증되지 않은 확대 해석</div><p class="smallnote">역사 자료에서 확인되는 사실과 이야기가 퍼진 이유에 대한 해석은 구분해야 해요. 위 설명은 자료를 바탕으로 생각해 본 가능성이며, 최초 발생 경위가 확정된 것은 아니에요.</p>`},
{title:'PART 3 · 직접 확인해 보자',html:`<div class="stamp">PART 03 · EXPERIMENT</div><h2>수분은 Wi-Fi 신호에 영향을 줄까?</h2><p class="lead">선인장 자체를 구하지 못해, 선인장 이야기에서 중요하게 언급되는 ‘물기와 전자파의 관계’를 간접적으로 살펴보기로 했어요. 그래서 물이 든 페트병을 선인장 대신 비교해 보는 물체로 사용했어요.</p><h3>탐구 질문</h3><p>수분을 포함한 물체는 2.4GHz Wi-Fi 신호의 전달에 영향을 줄까?</p><h3>비교 조건</h3><div class="experiment-visual" role="group" aria-label="세 가지 비교 실험 조건"><div class="condition-card"><span class="condition-icon">〰️</span><b>물체 없음</b><span>기준이 되는 상태</span></div><div class="condition-card"><span class="condition-icon">🧴</span><b>빈 페트병</b><span>병 자체의 영향 비교</span></div><div class="condition-card"><span class="condition-icon">💧</span><b>물이 든 페트병</b><span>물기가 있을 때와 비교</span></div></div><h3>측정 방법</h3><p>공유기 채널 1의 2.4GHz Wi-Fi 환경에서 휴대전화 앱으로 와이파이 신호 세기를 확인했어요. 물체가 없는 경우, 빈 페트병을 둔 경우, 물이 든 페트병을 둔 경우를 각각 10번씩 측정하고 평균과 측정값이 얼마나 퍼져 있는지도 비교했어요.</p><div class="callout"><strong>측정값을 읽는 방법</strong><p>앱에 표시되는 신호 세기는 dBm이라는 단위로 나타나요. 보통 숫자가 0에 가까울수록 신호가 강해요. 다만 이 숫자만으로 전자파가 물체에 얼마나 흡수됐는지를 직접 알 수는 없어요.</p></div>`},
{title:'PART 3 · 결과와 한계',html:`<div class="stamp">PART 03 · RESULTS</div><h2>측정 결과는 무엇을 말할까?</h2><p>실제로 측정한 값을 평균으로 정리하면 다음과 같아요.</p><table class="table"><tr><th>실험 조건</th><th>평균 와이파이 신호 세기</th><th>측정값의 퍼진 정도<br>(표준편차, dB)</th></tr><tr><td>물체 없음</td><td>−43.9 dBm</td><td>2.02</td></tr><tr><td>빈 페트병</td><td>−43.5 dBm</td><td>2.01</td></tr><tr><td>물이 담긴 페트병</td><td>−44.9 dBm</td><td>1.66</td></tr></table><div class="two"><div class="mini"><b>물체 없음 · 기준값</b><p>−43.9 dBm<br>비교 기준: 0.0 dB</p></div><div class="mini"><b>빈 페트병</b><p>−43.5 dBm<br>기준보다 +0.4 dB 강하게 측정</p></div><div class="mini"><b>물이 든 페트병</b><p>−44.9 dBm<br>기준보다 −1.0 dB 약하게 측정</p></div></div><p class="smallnote">dBm은 와이파이 신호의 세기를 나타낼 때 사용하는 단위예요. 보통 값이 0에 가까울수록 신호가 강해요. 아래 변화량은 물체가 없을 때 측정한 평균과 비교한 차이예요.</p><h3>결과 해석</h3><div class="callout"><strong>먼저 측정 결과를 살펴봐요</strong><p>물이 담긴 페트병을 놓았을 때 평균 신호 세기는 −44.9dBm이었어요. 물체가 없을 때의 −43.9dBm보다 1.0dB 낮게 측정된 거예요. 즉, 이번 측정에서는 물이 든 페트병을 놓았을 때 와이파이 신호가 조금 약해지는 경향이 나타났어요.</p></div><p>빈 페트병과 비교해도 물이 담긴 페트병의 평균 신호 세기가 1.4dB 낮았어요. 물기가 있는 물체가 와이파이 신호가 전달되는 데 영향을 주었을 가능성과 맞는 결과예요.</p><p>하지만 차이는 크지 않았어요. 측정값이 평균 주변에 얼마나 퍼져 있는지를 나타내는 표준편차는 약 1.66~2.02dB였어요. 이는 물체가 없을 때와 비교한 평균 차이인 1.0dB보다 큰 값이에요. 그래서 신호가 낮게 측정됐다는 점은 기록할 수 있지만, 그 원인이 물의 흡수 때문이라고 단정할 수는 없어요. 전파가 주변 물체에 부딪혀 다른 방향으로 퍼지거나, 벽과 가구의 영향, 측정 위치의 작은 차이, 시간에 따른 와이파이 신호 변화도 결과에 영향을 줄 수 있어요.</p><p><strong>정리해 볼게요.</strong> 물이 든 페트병을 놓았을 때 신호가 약 1dB 낮게 측정되는 작은 변화가 있었어요. 하지만 이번 실험만으로 물이 전파를 흡수해서 신호가 약해졌다고 확인한 것은 아니에요.</p><div class="game"><div class="label">MINI GAME 03 · DATA READER</div><h3>가장 타당한 결론은?</h3><p>물이 든 페트병을 놓았을 때의 평균 신호 세기는 물체가 없을 때보다 1.0dB 낮았어요. 하지만 표준편차는 측정값이 평균 주변에 얼마나 퍼져 있는지 나타내는 값이에요. 이번 측정에서는 약 1.66~2.02dB였어요.</p><div class="choices"><button class="choice" data-game="g3" data-answer="a">A. 물은 전자파와 전혀 상호작용하지 않았다.</button><button class="choice" data-game="g3" data-answer="b">B. 물이 Wi-Fi 전파를 완전히 차단했다.</button><button class="choice" data-game="g3" data-answer="c">C. 물이 신호에 영향을 줬을 가능성은 있지만, 흡수 효과가 입증된 것은 아니다.</button></div><div class="feedback" id="g3">정답! 신호가 낮게 측정된 것은 실제 관찰 결과예요. 하지만 차이가 작고 측정값도 계속 달라졌기 때문에 물의 흡수만이 원인이라고 확정할 수는 없어요.</div></div><h3>실험의 한계</h3><ul><li>선인장 대신 물이 든 페트병을 사용했기 때문에 선인장 자체를 직접 실험한 것은 아니에요.</li><li>와이파이 신호 세기 변화만으로 전자파가 흡수됐는지, 반사됐는지 구분할 수 없어요.</li><li>주변의 벽이나 가구에 전파가 부딪혀 여러 방향으로 퍼지는 현상도 측정에 영향을 줄 수 있어요.</li><li>측정 횟수와 환경 통제를 더 강화한 후속 실험이 필요해요.</li></ul>`},
{title:'PART 4 · 전자파를 줄이려면 어떤 조건이 필요할까?',html:`<div class="stamp">PART 04 · WHAT IF?</div><h2>전자파를 줄이려면 어떤 조건이 필요할까요?</h2><p>전자파가 특정 공간으로 들어오는 것을 줄이려면 물체가 전자파를 흡수하는지만 보면 안 돼요. 어떤 종류의 전자파인지, 어떤 재료를 쓰는지, 보호할 공간을 얼마나 잘 둘러싸는지도 함께 살펴야 해요.</p><div class="two"><div class="mini"><b>이번 탐구에서 다룬 Wi-Fi 전파</b><p>와이파이처럼 주파수가 높은 전파는 구리나 알루미늄처럼 전기가 잘 통하는 금속으로 공간을 둘러싸면 약해질 수 있어요.</p></div><div class="mini"><b>모든 전자파에 같은 방법이 통할까요?</b><p>전자파의 종류와 주파수에 따라 줄이는 방법은 달라질 수 있어요. 한 가지 방법이 모든 전자파에 똑같이 효과가 있는 것은 아니에요.</p></div></div><h3>금속으로 둘러싼 공간의 예</h3><p>전자레인지 문에는 작은 구멍이 촘촘하게 뚫린 금속망이 있어요. 이 구조는 전자레인지 안에서 사용되는 전파가 바깥으로 나오는 것을 줄여 줘요. 다만 금속망의 구멍 크기와 모양, 전파의 종류에 따라 효과가 달라져요.</p><div class="game"><div class="label">MINI GAME 04 · BUILD A SHIELD</div><h3>어떤 것이 전파를 줄이는 구조에 가까울까요?</h3><p>바깥에서 들어오는 와이파이 같은 전파를 줄이고 싶어요. 다음 중 더 알맞은 방법은 무엇일까요?</p><div class="choices"><button class="choice" data-game="g4" data-answer="a">A. 작은 선인장 화분 하나를 공간 옆에 놓는다.</button><button class="choice" data-game="g4" data-answer="b">B. 전기가 잘 통하는 금속으로 보호할 공간을 적절히 둘러싼다.</button><button class="choice" data-game="g4" data-answer="c">C. 공간 안에 물컵 하나를 놓는다.</button></div><div class="feedback" id="g4">정답이에요! 와이파이처럼 주파수가 높은 전파를 줄이려면 전기가 잘 통하는 금속으로 공간을 둘러싸는 방법을 사용할 수 있어요. 실제 구조에서는 전파의 종류와 금속망의 구멍 크기도 고려해야 해요.</div></div>
<div class="game"><div class="label">INTERACTIVE LAB · TRY IT</div><h3>금속 차단막을 추가해 보세요</h3><p>전파가 나오는 곳에서 보호하려는 공간으로 향하는 모습을 간단하게 나타낸 모형이에요. 아래 버튼으로 금속 차단막을 추가하면, 이 모형에서는 보호 공간 쪽으로 지나가는 파동 표시가 줄어들어요.</p>
<div class="shield-sim" id="shieldSim">
  <div class="shield-stage">
    <div class="shield-node"><span class="shield-icon">📡</span>전파<br>발생원</div>
    <div class="wave-stack" id="incomingWaves" aria-label="금속 차단막에 도달하는 전파"></div>
    <div><div class="shield-panels" id="shieldPanels" aria-label="추가한 금속 차단막"></div><div style="text-align:center;font:10px Arial,sans-serif;color:#536b5a">금속 차단막</div></div>
    <div class="wave-stack" id="outgoingWaves" aria-label="보호 공간으로 전달되는 전파"></div>
    <div class="shield-node"><span class="shield-icon">🛡️</span>보호할<br>공간</div>
  </div>
  <div class="shield-legend"><span><i class="shield-dot"></i>다가오는 전파</span><span><i class="shield-dot gold"></i>통과한 전파 표시</span></div>
  <div class="shield-controls"><button type="button" id="addShield">＋ 금속 차단막 추가</button><button type="button" class="secondary" id="removeShield">− 제거</button><button type="button" class="secondary" id="resetShield">처음부터</button><span class="shield-count" id="shieldCount">금속 차단막 0장</span></div>
  <div class="shield-result" id="shieldResult" aria-live="polite">금속 차단막이 없어요. 이 모형에서는 전파 표시 8개가 모두 보호 공간 쪽으로 지나가요.</div>
</div>
<p class="smallnote">※ 이 그림은 원리를 이해하기 위한 간단한 모형이에요. 파동 표시의 개수는 실제 측정값이나 특정 재료의 성능을 뜻하지 않아요. 실제로 전파가 얼마나 줄어드는지는 전파의 종류, 재료, 두께, 틈과 모양에 따라 달라져요. 전파는 금속에 부딪혀 되돌아가거나, 일부가 흡수되거나, 통과할 수도 있어요.</p>
</div><p>따라서 선인장이 전자파를 줄이는 장치가 되려면 단순히 물기가 있는 것만으로는 부족해요. 줄이려는 전파에 알맞은 재료와 공간을 둘러싸는 구조가 필요해요. 책상 위의 작은 선인장 화분은 이런 조건을 갖추고 있지 않아요.</p>`},
{title:'에필로그 · 탐구를 마치며',html:`<div class="stamp">EPILOGUE · REFLECTION</div><h2>탐구를 마치며</h2><p class="lead">과학적으로 생각한다는 것은 어떤 주장을 무조건 믿거나 부정하는 것이 아니라, 관찰한 근거가 어디까지 설명해 주는지 확인하는 일이에요.</p><p>선인장 전자파 차단설에는 물기가 있는 물체와 전자파가 서로 영향을 주고받는다는 과학적 설명이 일부 연결돼 있어요. 하지만 이 사실만으로 선인장이 주변 공간의 전자파를 막아 준다고 결론 내릴 수는 없어요.</p><div class="reflection-list">
<div class="reflection-item"><h3>① 새롭게 알게 된 점</h3><p>흡수와 차폐는 얼핏 같은 말처럼 느껴지지만 엄연히 다른 말임을 깨달았어요. 흡수는 전자파의 에너지가 물체로 전달되는 현상이고, 차폐는 보호하려는 공간에 도달하는 전자파의 세기를 줄이는 효과예요. 차폐에는 전자파가 되돌아가는 현상이나 물체에 흡수되는 현상 등이 함께 작용할 수 있다는 점도 알게 되었어요.</p></div>
<div class="reflection-item"><h3>② 탐구하면서 어려웠던 점</h3><p>와이파이 신호 세기는 측정할 때마다 조금씩 달라졌어요. 물이 든 페트병을 놓았을 때 평균 신호가 약해지는 모습은 보였지만, 그 차이가 측정값의 흔들림보다 작아서 물이 전파를 흡수했다고 바로 결론 내리기 어려웠어요. 또 선인장을 직접 측정하지 못하고 물이 든 페트병을 비교 대상으로 사용했다는 한계도 있었어요.</p></div>
<div class="reflection-item"><h3>③ 어려움을 어떻게 다루었을까요?</h3><p>한 번의 측정값만으로 판단하지 않도록 각 조건을 10번씩 측정하고, 평균뿐 아니라 측정값이 얼마나 퍼져 있는지도 함께 비교했어요. 그리고 물이 든 페트병의 결과를 선인장 자체의 효과로 확대해서 말하지 않고, 이번 실험에서 확인한 범위와 확인하지 못한 부분을 구분해 정리했어요.</p></div>
<div class="reflection-item"><h3>④ 이번 탐구를 통해 배운 점</h3><p>처음 예상했던 설명과 측정 결과가 꼭 일치하는 것은 아니며, 결과가 작거나 불분명할 때는 그 한계를 그대로 인정하는 태도가 중요하다는 점을 배웠어요. 과학 탐구는 주장을 증명하는 데서 끝나는 것이 아니라, 내가 얻은 자료가 실제로 어디까지 말해 주는지 따져 보는 과정이라고 생각하게 되었어요.</p></div>
</div><div class="reflection-quote">일부 과학적 사실이 지나치게 넓게 해석되면 그럴듯한 미신이 될 수 있어요. 그래서 주장을 판단할 때는 어떤 조건에서 맞는 말인지, 증거에는 어떤 한계가 있는지 함께 살펴야 해요.</div><h3>참고 자료</h3><div class="source-list"><ol><li><a href="https://www.rra.go.kr/emf/wrongfact/rumor/index04.do" target="_blank" rel="noopener">국립전파연구원, 전자파 오해와 진실 – 숯·선인장 등 차단 주장</a></li><li><a href="https://www.rra.go.kr/emf/wrongfact/trenddata/index14.do?boardId=BOARD000000000000054&nbType=5" target="_blank" rel="noopener">국립전파연구원, 선인장은 전자파 차단효과가 있나요?</a></li><li><a href="https://aodr.org/_PR/view/?aidx=37535&bidx=3672" target="_blank" rel="noopener">Archives of Design Research, 1990년대 초중반 한국형 전자레인지의 번성과 퇴조</a></li><li><a href="https://www.donga.com/news/It/article/all/19961104/7205117/1" target="_blank" rel="noopener">동아일보, 삶속의 과학: 선인장이 전자파 흡수하나 (1996)</a></li><li><a href="https://safety.caltech.edu/documents/17971/Non-Ionizing_Radiation_Manual.pdf" target="_blank" rel="noopener">Caltech, Non-Ionizing Radiation Manual – 전파 및 자기장 차폐</a></li></ol></div><div class="footnote">이 기사는 선인장 대신 물이 담긴 페트병을 사용한 탐색적 실험을 포함해요. 실험 결과는 선인장 자체의 전자파 차폐 성능을 직접 입증하지 않아요.</div>`},

];
let current=0,mode='flip';const page=document.getElementById('page'),single=document.getElementById('singlepage'),all=document.getElementById('allpages'),progress=document.getElementById('progress'),nav=document.getElementById('navrow'),toc=document.getElementById('toc');
function render(){
  page.className='page '+(pages[current].kind||'');
  page.innerHTML=pages[current].html+(pages[current].kind==='cover'?'':`<div class="page-no">${String(current+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</div>`);
  progress.textContent=String(current+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').disabled=current===pages.length-1;
  attachGames(page);
  initShieldSimulator(page);
}
function buildToc(){
  const grid=document.getElementById('tocgrid');
  grid.innerHTML=pages.map((p,i)=>`<button data-page="${i}">${String(i+1).padStart(2,'0')} · ${p.title}</button>`).join('');
  grid.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{
    current=Number(b.dataset.page);setMode('flip');render();toc.classList.remove('open');
  }));
}
function setMode(m){
  mode=m;
  document.getElementById('flipBtn').classList.toggle('active',m==='flip');
  document.getElementById('scrollBtn').classList.toggle('active',m==='scroll');
  if(m==='scroll'){
    single.classList.add('hide');all.classList.add('show');
    all.innerHTML=pages.map((p,i)=>`<article class="page ${p.kind||''}">${p.html}<div class="page-no">${String(i+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</div></article>`).join('');
    nav.style.display='none';attachGames(all);initShieldSimulator(all);
  }else{
    single.classList.remove('hide');all.classList.remove('show');all.innerHTML='';nav.style.display='flex';
    attachGames(page);initShieldSimulator(page);
  }
}
function gameClick(e){
  const b=e.currentTarget,game=b.closest('.game');if(!game)return;
  const id=b.dataset.game,ans=b.dataset.answer,box=game.querySelector('.feedback');if(!box)return;
  const correct={g1:'b',g2:'a',g3:'c',g4:'b'}[id];
  const correctText={
    g1:'60Hz와 2.4GHz는 서로 다른 주파수예요. 가정용 전원의 주파수와 Wi-Fi의 주파수는 같은 종류의 신호가 아니에요.',
    g2:'물체 일부가 전자파를 흡수했다고 해서 보호하려는 공간 전체에 전파가 도달하지 않는 것은 아니에요.',
    g3:'측정값에는 작은 차이가 있었지만 그 차이만으로 물의 흡수 효과가 확인됐다고 말할 수는 없어요.',
    g4:'와이파이 같은 전파를 줄이려면 전기가 잘 통하는 금속으로 보호 공간을 둘러싸는 구조를 활용할 수 있어요.'
  }[id];
  const correctButton=game.querySelector('.choice[data-answer="'+correct+'"]');
  game.querySelectorAll('.choice').forEach(x=>{x.classList.remove('selected','correct','incorrect');x.setAttribute('aria-pressed','false');});
  b.classList.add('selected');b.setAttribute('aria-pressed','true');
  box.classList.add('show');box.classList.remove('correct','incorrect');
  if(ans===correct){
    b.classList.add('correct');box.classList.add('correct');box.textContent='정답이에요! '+correctText;
  }else{
    b.classList.add('incorrect');
    if(correctButton)correctButton.classList.add('correct');
    box.classList.add('incorrect');
    box.textContent='아쉽지만 정답이 아니에요. 선택한 답은 빨간색, 정답은 초록색으로 표시했어요. '+correct.toUpperCase()+'이 정답이에요. '+correctText;
  }
}
function attachGames(root){
  if(!root)return;
  root.querySelectorAll('.choice').forEach(b=>{b.removeEventListener('click',gameClick);b.addEventListener('click',gameClick);b.setAttribute('aria-pressed','false');});
}
function initShieldSimulator(root){
  if(!root)return;
  root.querySelectorAll('.shield-sim').forEach(sim=>{
    const incoming=sim.querySelector('#incomingWaves'),outgoing=sim.querySelector('#outgoingWaves');
    const panels=sim.querySelector('#shieldPanels'),countLabel=sim.querySelector('#shieldCount');
    const result=sim.querySelector('#shieldResult');
    const add=sim.querySelector('#addShield'),remove=sim.querySelector('#removeShield'),reset=sim.querySelector('#resetShield');
    if(!incoming||!outgoing||!panels||!countLabel||!result||!add||!remove||!reset)return;
    if(sim.dataset.initialized==='true')return;
    sim.dataset.initialized='true';
    let shieldCount=0;
    const MAX=5;
    function makeWaves(container,n,kind){
      container.innerHTML='';
      for(let i=0;i<n;i++){
        const line=document.createElement('div');line.className='wave-line'+(kind==='out'?' transmitted':'');line.textContent='〰〰〰〰〰';
        container.appendChild(line);
      }
    }
    function update(){
      const transmitted=[8,6,4,2,1,0][shieldCount];
      panels.innerHTML='';
      for(let i=0;i<shieldCount;i++){const panel=document.createElement('span');panel.className='shield-panel';panel.setAttribute('aria-label','금속 차단막 '+(i+1));panels.appendChild(panel);}
      makeWaves(incoming,8,'in');makeWaves(outgoing,transmitted,'out');
      countLabel.textContent='금속 차단막 '+shieldCount+'장';
      add.disabled=shieldCount>=MAX;remove.disabled=shieldCount<=0;
      result.textContent=shieldCount===0
        ? '금속 차단막이 없어요. 이 모형에서는 전파 표시 8개가 모두 보호 공간 쪽으로 지나가요.'
        : '금속 차단막 '+shieldCount+'장: 이 모형에서는 8개 중 '+transmitted+'개의 파동 표시가 보호 공간 쪽으로 지나가요. 실제 차폐량을 나타내는 수치는 아니에요.';
    }
    add.addEventListener('click',()=>{if(shieldCount<MAX){shieldCount++;update();}});
    remove.addEventListener('click',()=>{if(shieldCount>0){shieldCount--;update();}});
    reset.addEventListener('click',()=>{shieldCount=0;update();});
    update();
  });
}
document.getElementById('prev').addEventListener('click',()=>{if(current>0){current--;render();}});
document.getElementById('next').addEventListener('click',()=>{if(current<pages.length-1){current++;render();}});
document.getElementById('tocBtn').addEventListener('click',()=>toc.classList.toggle('open'));
document.getElementById('flipBtn').addEventListener('click',()=>{setMode('flip');render();});
document.getElementById('scrollBtn').addEventListener('click',()=>setMode('scroll'));
buildToc();render();
</script></body></html>
